
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}ST Passport Studio{% endblock %}</title>

    <!-- Main Website CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- HEADER -->
    <header class="main-header">

        <div class="brand">
            <div class="brand-icon">ST</div>

            <div>
                <h2>ST Passport Studio</h2>
                <p>Professional Passport Photo Creator</p>
            </div>
        </div>

        <div class="header-note">
            No Account Required
        </div>

    </header>

    <!-- MAIN CONTENT -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER -->
    <footer>
        <p>
            © 2026 ST Passport Studio.
            Create professional passport photos easily.
        </p>
    </footer>

    <script src="{{ url_for('static', filename='js/crop_editor.js') }}"></script>

<script src="{{ url_for('static', filename='js/photo_editor.js') }}"></script>

<script src="{{ url_for('static', filename='js/background_editor.js') }}"></script>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
